<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f8f2"><meta name="referrer" content="no-referrer"><title>转盘记录 · 王哥代下单</title><link rel="icon" href="./app-icon-192.png">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:#253e33;background:#f7f8f2}*{box-sizing:border-box}body{margin:0}main{max-width:920px;margin:auto;padding:35px 22px}header,.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1{font-size:25px;margin:6px 0}h2{font-size:17px;margin:0 0 14px}.muted{color:#829078;font-size:12px;line-height:1.8}a{color:#526d49;font-size:12px}.card{border:1px solid #e5e9df;background:#ffffffbd;border-radius:19px;padding:21px;margin:21px 0}label{display:block;font-size:12px;margin:12px 0 7px}input,select,button{font:inherit;border:1px solid #dfe5d7;border-radius:10px;padding:11px 13px;font-size:13px;max-width:100%}input,select{background:white;color:#253e33}input[type=email]{width:min(100%,360px)}button{background:#2b4b3d;color:#fff;border-color:transparent;cursor:pointer}button:disabled{opacity:.5;cursor:wait}.secondary{background:#eaf0e2;color:#4f6548}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #edaa71;outline-offset:2px}#status{font-size:12px;line-height:1.8;min-height:22px;color:#8b653e;overflow-wrap:anywhere}.link-item{padding:13px 0;border-top:1px solid #e9eddf;display:flex;gap:12px;align-items:center;justify-content:space-between}.link-name{overflow-wrap:anywhere;font-size:13px}.link-item button{padding:8px 11px;flex-shrink:0}table{width:100%;border-collapse:collapse;white-space:nowrap;font-size:12px}th{text-align:left;color:#87917e;font-weight:500}td,th{padding:14px 12px;border-bottom:1px solid #edf0e8}td:nth-child(3){color:#d67e47;font-weight:600}.table-wrap{overflow:auto;margin-top:14px}.summary{font-size:12px;color:#7d8a74}#load-more{display:block;margin:20px auto 0}[hidden]{display:none!important}@media(max-width:480px){main{padding:24px 16px}.card{padding:17px}h1{font-size:23px}.row form{width:100%;display:flex;gap:8px}.row form input{min-width:0;flex:1}.table-wrap{margin:14px -7px 0}td,th{padding:12px 7px}}
</style></head>
<body><main><header><div><p class="muted">王哥代下单 / 管理页</p><h1>每一次新鲜，都有记录。</h1></div><a href="./">返回转盘 →</a></header>
<p id="status" role="status" aria-live="polite"></p>
<section id="login" class="card"><h2>登录查看记录</h2><p class="muted">输入你的邮箱，打开收到的登录链接。请始终使用同一个邮箱，以查看自己创建的专属链接及记录。</p><form id="login-form"><label for="email">管理邮箱</label><input id="email" type="email" required autocomplete="email" placeholder="你的邮箱"><button type="submit">发送登录链接</button></form></section>
<div id="dashboard" hidden><div class="row"><span class="muted" id="account"></span><button id="logout" class="secondary">退出登录</button></div>
<section class="card"><div class="row"><h2>给对方一个专属链接</h2><form id="link-form"><input id="link-label" required maxlength="30" aria-label="对方的称呼" placeholder="对方的称呼，例如：朋友 A"><button type="submit">创建链接</button></form></div><p class="muted">复制专属链接发给对方，之后每次转盘都会同步到这里。已有的普通转盘链接不会自动上传记录。</p><div id="links"></div></section>
<section class="card"><div class="row"><h2>全部转盘记录</h2><div class="row"><select id="filter" aria-label="按专属链接筛选"><option value="">所有人</option></select><button id="refresh" class="secondary">刷新</button><button id="export" class="secondary">导出 CSV</button></div></div><p class="summary" id="summary"></p><div class="table-wrap"><table><thead><tr><th>对方</th><th>转盘时间（北京时间）</th><th>水果</th><th>同步时间（北京时间）</th></tr></thead><tbody id="records"></tbody></table></div><button id="load-more" class="secondary" hidden>加载更早记录</button></section></div>
</main><script src="./config.js"></script><script src="./admin.js"></script></body></html>
